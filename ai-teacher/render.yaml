# Render.com blueprint - deploys backend (web service) and frontend (static site)
# Usage: push this repo to GitHub, then in Render choose "New +" -> "Blueprint"
# and point it at this repo. Fill in the OPENAI_API_KEY (and optionally
# DID_API_KEY) as secret env vars when prompted.
services:
  - type: web
    name: ai-teacher-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_TTS_MODEL
        value: tts-1
      - key: OPENAI_TTS_VOICE
        value: alloy
      - key: DID_API_KEY
        sync: false
      - key: DID_AVATAR_IMAGE_URL
        value: https://create-images-results.d-id.com/DefaultPresenters/Emma_f/image.jpeg
      - key: DATABASE_FILE
        value: ./data/ai_teacher.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: MAX_UPLOAD_MB
        value: 25
      - key: CLIENT_ORIGIN
        value: https://ai-teacher-frontend.onrender.com
    disk:
      name: ai-teacher-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  - type: web
    name: ai-teacher-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-teacher-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
